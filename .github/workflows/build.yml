name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev libvulkan-dev python3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: ./build.sh

      - name: Package
        run: tar -czf aztek-linux-x86_64.tar.gz -C build aztek

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-linux-x86_64
          path: aztek-linux-x86_64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      - name: Ninja
        run: python -m pip install ninja

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/cargo"

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Qt $env:QT_ROOT_DIR

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\dist\* -DestinationPath aztek-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-windows-x86_64
          path: aztek-windows-x86_64.zip

  # Every push to main replaces the "latest" pre-release; a v* tag makes a versioned release.
  release:
    needs: [linux, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Latest build
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest aztek-linux-x86_64.tar.gz aztek-windows-x86_64.zip \
            --target "$GITHUB_SHA" --prerelease --title "Latest build" \
            --notes "Built from $GITHUB_SHA on $(date -u +%d/%m/%Y)."

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" aztek-linux-x86_64.tar.gz aztek-windows-x86_64.zip \
            --title "Aztek $GITHUB_REF_NAME" --generate-notes
